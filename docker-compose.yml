# One command: `docker compose up --build`, then open http://localhost:3000
# Put GEMINI_API_KEY in backend/.env (optional: without it, ingestion + search still work).
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: backend/.env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - verbatim-data:/data

  web:
    build:
      context: frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  verbatim-data:
