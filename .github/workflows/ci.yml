name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint & format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy app evals
      - name: Unit & API tests (offline, fake LLM)
        run: uv run pytest
      - name: Dependency vulnerability audit (production deps)
        run: |
          uv export --frozen --no-dev --all-extras --format requirements-txt -q > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --disable-pip
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: backend/.fastembed
          key: fastembed-bge-small-en-v1.5
      - name: Retrieval eval gate (offline, deterministic)
        env:
          EMBEDDING_CACHE_DIR: .fastembed
        run: uv run python -m evals.retrieval_eval --min-mrr 0.75 --min-hit3 0.9

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Dependency vulnerability audit (production deps)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
