# Evaluation set for Verbatim, over the 4 synthetic meetings in /sample_data.
#
# Each case:
#   meeting:   filename prefix of the meeting that holds the answer
#   evidence:  verbatim phrase from the transcript that answers it (retrieval hit = a top-k chunk
#              from that meeting contains this phrase)
#   must_include: answer check - list of groups; every group needs at least one of its terms
#   type:      exact (ids/names/numbers) | paraphrase (wording differs from transcript) |
#              cross_meeting (answer changed between meetings; latest must win) | attribution
#   answerable: false -> the correct behaviour is to say the meetings don't cover it
#
# Questions are phrased the way a user would ask, not copied from the transcript.

cases:
  - id: q01
    question: Why did we pick AWS SNS over Twilio for reminders?
    meeting: 2026-10-13_adherence
    evidence: We already have a signed BAA with AWS that covers SNS
    must_include: [[BAA, business associate], [cheaper, cost, "40 percent"]]
    type: exact

  - id: q02
    question: What is ticket PRJ-2291 about?
    meeting: 2026-10-13_adherence
    evidence: ticket PRJ-2291
    must_include: [[sync], [battery, WorkManager]]
    type: exact

  - id: q03
